<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="io.FuriOS.Biomd"/>
  </policy>

  <!-- Allow anyone to invoke methods on the service -->
  <policy context="default">
    <allow send_destination="io.FuriOS.Biomd"/>
    <allow send_destination="io.FuriOS.Biomd.Fingerprint"/>
    <allow receive_sender="io.FuriOS.Biomd"/>
    <allow receive_sender="io.FuriOS.Biomd.Fingerprint"/>
  </policy>
</busconfig>
